[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-eval-core"
version = "0.3.0a1"
description = "RYUU eval framework — Protocols + runner + renderers. No built-in scorers (use ryuu-eval-scorers)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "anyio[trio]>=4.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.6.0"]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_eval_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
