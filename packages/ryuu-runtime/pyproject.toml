[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-runtime"
version = "0.2.0a1"
description = "RYUU runtime — intent analysis, strategy selection, and request handling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-providers>=0.2.0a1",
    "ryuu-cognitive>=0.2.0a1",
    "ryuu-execution>=0.2.0a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_runtime"]
