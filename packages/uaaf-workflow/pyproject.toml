[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uaaf-workflow"
version = "0.2.0a1"
description = "Standalone workflow engine and state machine — extracted from UAAF"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/uaaf-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/uaaf_workflow"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
