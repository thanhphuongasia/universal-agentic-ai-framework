[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-intent"
version = "0.3.0a1"
description = "Intent + difficulty classification primitives for Ryuu framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-providers-core>=0.3.0a1",   # Phase 8.14 — for LLMIntentAnalyzer
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_intent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ryuu_intent/**/*.py",
    "src/ryuu_intent/py.typed",
    "src/ryuu_intent/prompts/**/*.yaml",
]
