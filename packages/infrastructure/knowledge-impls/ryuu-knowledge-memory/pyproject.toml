[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-knowledge-memory"
version = "0.2.0a1"
description = "RYUU Knowledge Memory — working and episodic memory backbone"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-knowledge-base>=0.2.0a1",
    "ryuu-storage-core>=0.3.0a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_knowledge_memory"]
