[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-mcp-client"
version = "0.3.0a1"
description = "MCP client + multi-server orchestration — connect Ryuu agents to any MCP server (filesystem, GitHub, Gmail, custom)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-mcp-core>=0.3.0a1",
    "ryuu-execution>=0.2.0a1",   # ITool Protocol — MCPTool implements it
    "mcp>=1.0",                    # Anthropic's Python SDK
    "pyyaml>=6.0",                 # skills.yaml loader
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "anyio[trio]>=4.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.6.0"]

[project.scripts]
# Generic OAuth helpers for remote HTTP MCP servers (TodoPro, Linear, etc.)
ryuu-mcp-oauth-pkce = "ryuu_mcp_client.oauth.pkce:main"
ryuu-mcp-oauth-run  = "ryuu_mcp_client.oauth.runner:main"

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_mcp_client"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/ryuu_mcp_client/data" = "ryuu_mcp_client/data"
