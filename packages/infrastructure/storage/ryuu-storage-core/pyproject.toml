[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-storage-core"
version = "0.3.0a1"
description = "Storage Protocols — IKVStore, ICollectionStore, IBlobStore. Zero deps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_storage_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
