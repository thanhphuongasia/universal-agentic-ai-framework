[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-observability"
version = "0.2.0a1"
description = "RYUU observability — back-compat metapackage (real code in ryuu-observability-core + ryuu-observability-otel)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-observability-core>=0.3.0a1",
]

[project.optional-dependencies]
otel = ["ryuu-observability-otel>=0.3.0a1"]
all = ["ryuu-observability-otel>=0.3.0a1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_observability"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
