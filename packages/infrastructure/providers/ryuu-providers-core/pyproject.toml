[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-providers-core"
version = "0.3.0a1"
description = "RYUU providers core — ILLMProvider Protocol, pricing, ModelRouter, CircuitBreaker, FallbackChain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_providers_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ryuu_providers_core/**/*.py",
    "src/ryuu_providers_core/py.typed",
    "src/ryuu_providers_core/pricing.yaml",
]
