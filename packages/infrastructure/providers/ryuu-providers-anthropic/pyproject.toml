[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-providers-anthropic"
version = "0.3.0a1"
description = "RYUU Anthropic adapter — ILLMProvider implementation for Anthropic's API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-providers-core>=0.3.0a1",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_providers_anthropic"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
