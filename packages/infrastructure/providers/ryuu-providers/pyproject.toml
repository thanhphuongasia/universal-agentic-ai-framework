[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-providers"
version = "0.2.0a1"
description = "RYUU providers — back-compat metapackage (real code in ryuu-providers-core + ryuu-providers-{openai,anthropic})"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-providers-core>=0.3.0a1",
]

[project.optional-dependencies]
openai = ["ryuu-providers-openai>=0.3.0a1"]
anthropic = ["ryuu-providers-anthropic>=0.3.0a1"]
all = ["ryuu-providers-openai>=0.3.0a1", "ryuu-providers-anthropic>=0.3.0a1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_providers"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
