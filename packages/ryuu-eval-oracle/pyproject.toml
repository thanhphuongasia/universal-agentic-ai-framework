[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-eval-oracle"
version = "0.1.0a1"
description = "RYUU eval oracle — generic ground truth generation with human review workflow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-eval-core>=0.3.0a1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "anyio[trio]>=4.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.6.0", "pytest-mock>=3.12"]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_eval_oracle"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
