name: "oracle_meta_prompt_user_template"
version: "1.0.0"
description: >
  User-side template fed into the meta-prompt. Carries the per-call domain
  context (project name, domain hint, production prompt text) — keeps the
  system prompt fully generic.

user_template: |
  PROJECT: {{ project_name }}
  DOMAIN/FRAMEWORK (if known): {{ domain_hint }}

  EXPECTED OUTPUT SHAPE (preserve verbatim — same nesting, same key names,
  same enum values; only ADD a per-cell `confidence` and `why` if missing):
  {{ output_schema_hint }}

  PRODUCTION PROMPT:
  {{ production_prompt_text }}
