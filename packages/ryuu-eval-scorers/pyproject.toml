[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-eval-scorers"
version = "0.3.0a1"
description = "RYUU eval scorers — ExactMatch, JsonSubset, LLMJudgeScorer, NumericTolerance, KeywordCoverage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["ryuu-eval-core>=0.3.0a1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "anyio[trio]>=4.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.6.0"]

[project.urls]
Repository = "https://github.com/core-corp/ryuu-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_eval_scorers"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
