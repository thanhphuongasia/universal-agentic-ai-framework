[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-eval"
version = "0.2.0a1"
description = "RYUU Eval — evaluation framework for AI agents (dev dependency)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-eval-core>=0.3.0a1",
    "ryuu-eval-scorers>=0.3.0a1",
    "ryuu-prompts>=0.3.0a1",
]

[project.optional-dependencies]
oracle = ["ryuu-eval-oracle>=0.1.0a1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_eval"]
