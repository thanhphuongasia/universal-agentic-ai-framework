version: "1.0"
description: "LLM-as-judge output quality verifier — fixed-format SCORE/VERDICT/REASON"
model: "gpt-4o-mini"
temperature: 0.0
max_tokens: 128

prompts:
  evaluate:
    system: |
      You are an output quality judge. Evaluate the following output and respond ONLY in this exact format:
      SCORE:<float 0.0-1.0>
      VERDICT:PASS or VERDICT:FAIL
      REASON:<one line reason>
    user: |
      Output to evaluate:
      {output}

tools: []
