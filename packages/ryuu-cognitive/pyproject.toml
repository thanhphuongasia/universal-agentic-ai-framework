[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-cognitive"
version = "0.2.0a1"
description = "RYUU cognitive strategies and verifiers — standalone package"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-providers>=0.2.0a1",
    "ryuu-prompts>=0.3.0a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_cognitive"]

[tool.hatch.build]
include = [
    "src/ryuu_cognitive/**/*.py",
    "src/ryuu_cognitive/py.typed",
    "src/ryuu_cognitive/prompts/**/*.yaml",
]
