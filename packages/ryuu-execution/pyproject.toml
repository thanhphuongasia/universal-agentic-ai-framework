[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu-execution"
version = "0.2.0a1"
description = "RYUU execution tier — BaseAgent, LLMAgent, AgentPool, ToolRegistry, Sandbox"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-providers>=0.2.0a1",
    "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ryuu_execution"]
