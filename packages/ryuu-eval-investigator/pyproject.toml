[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryuu-eval-investigator"
version = "0.1.0"
description = "Generic investigation framework — agent-agnostic core + pluggable backends"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sqlite = []  # stdlib sqlite3
postgres = ["psycopg2-binary>=2.9"]
agent_sdk = ["claude-agent-sdk>=0.2.87"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ryuu_eval_investigator.prompts" = ["*.yml"]
