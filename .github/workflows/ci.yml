name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e packages/ryuu-core
          pip install -e packages/ryuu-workflow
          pip install -e packages/infrastructure/providers/ryuu-providers
          pip install -e packages/infrastructure/observability/ryuu-observability
          pip install -e packages/ryuu-cognitive
          pip install -e packages/ryuu-execution
          pip install -e packages/ryuu-runtime
          pip install -e packages/ryuu-knowledge-base
          pip install -e packages/infrastructure/knowledge-impls/ryuu-knowledge-memory
          pip install -e packages/infrastructure/knowledge-impls/ryuu-knowledge-graph
          pip install -e packages/infrastructure/knowledge-impls/ryuu-knowledge
          pip install -e packages/ryuu-guardrail
          pip install -e packages/ryuu-eval
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check ryuu/ packages/ryuu-core/src/ packages/ryuu-workflow/src/ packages/infrastructure/providers/ryuu-providers/src/ packages/infrastructure/observability/ryuu-observability/src/ packages/ryuu-cognitive/src/ packages/ryuu-execution/src/ packages/ryuu-runtime/src/ packages/ryuu-knowledge-base/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge-memory/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge-graph/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge/src/ packages/ryuu-guardrail/src/ packages/ryuu-eval/src/ tests/

      - name: Type check
        run: mypy ryuu/ packages/ryuu-core/src/ packages/ryuu-workflow/src/ packages/infrastructure/providers/ryuu-providers/src/ packages/infrastructure/observability/ryuu-observability/src/ packages/ryuu-cognitive/src/ packages/ryuu-execution/src/ packages/ryuu-runtime/src/ packages/ryuu-knowledge-base/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge-memory/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge-graph/src/ packages/infrastructure/knowledge-impls/ryuu-knowledge/src/ packages/ryuu-guardrail/src/ packages/ryuu-eval/src/

      - name: Test with coverage
        run: pytest --cov=ryuu --cov=packages/ryuu-workflow/src --cov=packages/infrastructure/providers/ryuu-providers/src --cov=packages/infrastructure/observability/ryuu-observability/src --cov=packages/ryuu-cognitive/src --cov=packages/ryuu-execution/src --cov=packages/ryuu-runtime/src --cov=packages/ryuu-knowledge-base/src --cov=packages/infrastructure/knowledge-impls/ryuu-knowledge-memory/src --cov=packages/infrastructure/knowledge-impls/ryuu-knowledge-graph/src --cov=packages/infrastructure/knowledge-impls/ryuu-knowledge/src --cov=packages/ryuu-guardrail/src --cov=packages/ryuu-eval/src --cov-report=xml --cov-fail-under=85

      - name: Build ryuu wheel
        run: python -m build

      - name: Build ryuu-core wheel
        run: python -m build packages/ryuu-core

      - name: Build ryuu-workflow wheel
        run: python -m build packages/ryuu-workflow

      - name: Build ryuu-providers wheel
        run: python -m build packages/infrastructure/providers/ryuu-providers

      - name: Build ryuu-observability wheel
        run: python -m build packages/infrastructure/observability/ryuu-observability

      - name: Build ryuu-cognitive wheel
        run: python -m build packages/ryuu-cognitive

      - name: Build ryuu-execution wheel
        run: python -m build packages/ryuu-execution

      - name: Build ryuu-runtime wheel
        run: python -m build packages/ryuu-runtime

      - name: Build ryuu-knowledge-base wheel
        run: python -m build packages/ryuu-knowledge-base

      - name: Build ryuu-knowledge-memory wheel
        run: python -m build packages/infrastructure/knowledge-impls/ryuu-knowledge-memory

      - name: Build ryuu-knowledge-graph wheel
        run: python -m build packages/infrastructure/knowledge-impls/ryuu-knowledge-graph

      - name: Build ryuu-knowledge wheel
        run: python -m build packages/infrastructure/knowledge-impls/ryuu-knowledge

      - name: Build ryuu-guardrail wheel
        run: python -m build packages/ryuu-guardrail

      - name: Build ryuu-eval wheel
        run: python -m build packages/ryuu-eval

  workflow-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ryuu-workflow wheel
        run: |
          pip install build
          python -m build --wheel packages/ryuu-workflow

      - name: Run isolation test
        run: bash scripts/test-workflow-isolation.sh

  core-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ryuu-core wheel
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core

      - name: Run core isolation test
        run: bash scripts/test-core-isolation.sh

  providers-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/providers/ryuu-providers

      - name: Run providers isolation test
        run: bash scripts/test-providers-isolation.sh

  observability-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/observability/ryuu-observability

      - name: Run observability isolation test
        run: bash scripts/test-observability-isolation.sh

  cognitive-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/providers/ryuu-providers
          python -m build --wheel packages/ryuu-cognitive

      - name: Run cognitive isolation test
        run: bash scripts/test-cognitive-isolation.sh

  execution-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/providers/ryuu-providers
          python -m build --wheel packages/ryuu-execution

      - name: Run execution isolation test
        run: bash scripts/test-execution-isolation.sh

  runtime-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/providers/ryuu-providers
          python -m build --wheel packages/ryuu-cognitive
          python -m build --wheel packages/ryuu-execution
          python -m build --wheel packages/ryuu-runtime

      - name: Run runtime isolation test
        run: bash scripts/test-runtime-isolation.sh

  knowledge-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-knowledge-base
          python -m build --wheel packages/infrastructure/knowledge-impls/ryuu-knowledge-memory
          python -m build --wheel packages/infrastructure/knowledge-impls/ryuu-knowledge-graph
          python -m build --wheel packages/infrastructure/knowledge-impls/ryuu-knowledge

      - name: Run knowledge isolation test
        run: bash scripts/test-knowledge-isolation.sh

  guardrail-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/ryuu-guardrail

      - name: Run guardrail isolation test
        run: bash scripts/test-guardrail-isolation.sh

  eval-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          pip install build
          python -m build --wheel packages/ryuu-core
          python -m build --wheel packages/infrastructure/providers/ryuu-providers
          python -m build --wheel packages/ryuu-eval

      - name: Run eval isolation test
        run: bash scripts/test-eval-isolation.sh

  postgres-storage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ryuu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ryuu-storage-postgres
        run: |
          pip install -e packages/infrastructure/storage/ryuu-storage-core
          pip install -e "packages/infrastructure/storage/ryuu-storage-postgres[dev]"

      - name: Run Postgres storage tests
        env:
          DATABASE_URL: postgresql://postgres:test@localhost/ryuu_test
        run: pytest packages/infrastructure/storage/ryuu-storage-postgres/tests/ -v
