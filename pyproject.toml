[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryuu"
version = "0.3.0a14"
description = "Universal Agentic AI Framework — pluggable foundation for AI agent products"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "ryuu-core>=0.2.0a1",
    "ryuu-workflow>=0.2.0a1",
    "ryuu-providers>=0.2.0a1",
    "ryuu-observability>=0.2.0a1",
    "ryuu-cognitive>=0.2.0a1",
    "ryuu-execution>=0.2.0a1",
    "ryuu-runtime>=0.2.0a1",
    "ryuu-knowledge-base>=0.2.0a1",
    "ryuu-knowledge-memory>=0.2.0a1",
    "ryuu-knowledge-graph>=0.2.0a1",
    "ryuu-knowledge>=0.2.0a1",
    "ryuu-guardrail>=0.2.0a1",
    "ryuu-eval>=0.2.0a1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=7.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
    "build>=1.0",
    "openai>=1.40",
    "anthropic>=0.40",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["ryuu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["ryuu", "packages/ryuu-workflow/src", "packages/ryuu-core/src"]
omit = ["ryuu/_testing/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
